[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghalint"
version = "0.1.0"
description = "Lint GitHub Actions workflow files for common issues."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Axelgustavlindstrom", email = "292675736+Axelgustavlindstrom@users.noreply.github.com"},
]
keywords = ["github-actions", "ci", "lint", "workflow", "yaml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.urls]
Repository = "https://github.com/Axelgustavlindstrom/ghalint"

[project.scripts]
ghalint = "ghalint.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ghalint*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py39"
lint.select = ["E", "F", "W", "I"]
lint.ignore = []
format.skip-magic-trailing-comma = false
